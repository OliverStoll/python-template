name: Android release

# Publishes a signed Sober.apk as a GitHub Release, which is what an
# auto-updater (Obtainium, F-Droid) watches. Tag a commit v1.5, v1.6, … to cut
# a release; the tag must match android:versionName in the manifest.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache the build toolchain
        uses: actions/cache@v4
        with:
          # build.sh downloads android.jar, aapt2, dx and apksig here.
          path: ~/atools
          key: sober-atools-v1

      - name: Read the manifest version
        id: version
        run: |
          manifest=android/AndroidManifest.xml
          name=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' "$manifest" | head -1)
          code=$(sed -n 's/.*android:versionCode="\([^"]*\)".*/\1/p' "$manifest" | head -1)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Manifest says v$name (code $code)"

      - name: Check the tag matches the manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ steps.version.outputs.name }}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName ${{ steps.version.outputs.name }}." >&2
            echo "Bump android:versionName and android:versionCode, then retag." >&2
            exit 1
          fi

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SOBER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret SOBER_KEYSTORE_BASE64 is not set. Without the" \
                 "shared key every release gets a different signature and Android" \
                 "refuses to install it as an update."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sober.p12"

      - name: Test
        run: android/test.sh

      - name: Build
        env:
          SOBER_KEYSTORE_PASSWORD: ${{ secrets.SOBER_KEYSTORE_PASSWORD }}
        run: |
          export SOBER_KEYSTORE="$RUNNER_TEMP/sober.p12"
          export SOBER_KEYSTORE_PASSWORD="${SOBER_KEYSTORE_PASSWORD:-android}"
          android/build.sh

      - name: Verify the APK
        run: android/verify.sh

      - name: Name the artifact after its version
        run: cp android/out/Sober.apk "Sober-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Sober-${{ steps.version.outputs.name }}
          path: Sober-${{ steps.version.outputs.name }}.apk

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Sober-${{ steps.version.outputs.name }}.apk" \
            --title "Sober ${{ steps.version.outputs.name }}" \
            --notes "versionCode ${{ steps.version.outputs.code }}. Install over any earlier build."
